<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore custom luxury bridal mehndi and intricate freehand henna designs by Anu Henna Creations.">
    <title>The Signature Portfolio | Anu Henna Creations</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-top: 3rem; }
        .gallery-item { aspect-ratio: 4/5; overflow: hidden; position: relative; background: var(--color-primary); border-radius: 2px; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .gallery-item:hover img { transform: scale(1.05); opacity: 0.8; }
        @media (max-width: 768px) { .gallery-grid { grid-template-columns: 1fr; gap: 1.5rem; } }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">ANU HENNA CREATIONS</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="portfolio.html" class="active">Portfolio</a></li>
                    <li><a href="booking.html">Bookings</a></li>
                    <li><a href="shop.html">Shop</a></li>
                </ul>
            </nav>
            <button class="mobile-toggle" aria-label="Toggle Navigation">☰</button>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <h2>The Signature Galleries</h2>
            <p>A window into custom freehand line density, symmetry, and rich natural tones.</p>
        </div>

        <div class="gallery-grid" id="portfolioGrid">
            <div class="gallery-item"><img src="images/bridal-1.jpg" alt="Bridal Elegance"></div>
            <div class="gallery-item"><img src="images/bridal-2.jpg" alt="Traditional Bridal"></div>
            <div class="gallery-item"><img src="images/custom-3.jpg" alt="Custom Design"></div>
            <div class="gallery-item"><img src="images/custom-4.jpg" alt="Personalized Henna"></div>
            <div class="gallery-item"><img src="images/custom-5.jpg" alt="Custom Personalized"></div>
            <div class="gallery-item"><img src="images/bridal-6.jpg" alt="Bridal Design"></div>
            <div class="gallery-item"><img src="images/bridal-7.jpg" alt="Peacock Design"></div>
            <div class="gallery-item"><img src="images/bridal-8.jpg" alt="Bridal Personalized"></div>
            <div class="gallery-item"><img src="images/festive-9.jpg" alt="Festive Elephant Design"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Anu Henna Creations.</p>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="portfolio.js"></script>
</body>
</html>
